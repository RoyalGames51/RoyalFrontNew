<!doctype html>
<html lang="en" class="dark">
  <head>
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-6569283873873097"
     crossorigin="anonymous"></script>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo.avif" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&amp;family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
    <!-- ⚠️ PayPal Client ID should be injected at build time from environment variables -->
    <!-- For development: Update this with your own PayPal Client ID or use import.meta.env in React components -->
    <script id="paypal-script"></script>

    <title>RoyalGames</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      // Inject PayPal script dynamically from environment variable
      function initPayPalScript() {
        const clientId = import.meta.env.VITE_PAYPAL_CLIENT_ID;
        if (clientId) {
          const script = document.getElementById('paypal-script');
          script.src = `https://www.paypal.com/sdk/js?client-id=${clientId}&currency=USD`;
          script.async = true;
        }
      }
      initPayPalScript();
    </script>
  </body>
</html>
